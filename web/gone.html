<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>RÚNA</title>
    <link rel="stylesheet" href="/gone.css" />
  </head>
  <body class="void">
    <main class="tombstone">
      <div class="mark" aria-hidden="true">◐</div>
      <h1>Gone. Reduced to atoms.</h1>
      <p class="lede">The room, its keys and every line of its history are destroyed.</p>
      <hr class="rule" aria-hidden="true" />
      <!--
        No room name, no timestamp, nothing identifying. This page is served
        with Clear-Site-Data and deliberately knows nothing about what used to
        be here; naming the room on its own tombstone would put that address
        in a browser history that has just been wiped for exactly that reason.

        It previously read "ROOM —— · SHREDDED —— UTC" with the dashes as
        placeholders. Nothing ever filled them in — no script referenced the
        element at all — so it rendered as literal em dashes for every reader.
      -->
      <p class="meta">Copies other people already made are not. Nothing here can reach those.</p>
    </main>
  </body>
</html>
