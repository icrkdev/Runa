[package]
name = "runa-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# cargo-fuzz refuses to run without this marker: "does not look like a
# cargo-fuzz manifest". It was missing, so fixing the job's working directory
# alone would have swapped one red scheduled run for another.
[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
runa-server = { path = ".." }
serde_json = "1"

[[bin]]
name = "frame_header"
path = "fuzz_targets/frame_header.rs"
test = false
doc = false

[[bin]]
name = "room_name"
path = "fuzz_targets/room_name.rs"
test = false
doc = false

[[bin]]
name = "log_compaction"
path = "fuzz_targets/log_compaction.rs"
test = false
doc = false

[[bin]]
name = "create_body"
path = "fuzz_targets/create_body.rs"
test = false
doc = false
