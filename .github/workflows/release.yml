name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything else waits on this.
  #
  # A tag is the one thing in this pipeline that cannot be taken back: by the
  # time anything is wrong, an image is on GHCR, artifacts are signed by a
  # certificate bound to that tag, and a release is public. v0.2.1 shipped a
  # bill of materials naming 0.2.0, because bumping the manifests is a
  # separate manual step from tagging and was simply forgotten — the same
  # fault v0.2.0 had, fixed once by hand and immediately repeated.
  #
  # So the check runs first and blocks the rest. A release that disagrees with
  # itself never gets built.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The tag, the manifests and the changelog must agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          # A pre-release shares its base version's manifests and notes:
          # 0.3.0-rc.1 is still 0.3.0 as far as the crate is concerned.
          BASE="${TAG%%-*}"
          CARGO=$(grep -m1 '^version = ' server/Cargo.toml | cut -d'"' -f2)
          WEB=$(node -p "require('./web/package.json').version")
          echo "tag=$TAG base=$BASE cargo=$CARGO web=$WEB"

          fail=0
          if [ "$CARGO" != "$BASE" ]; then
            echo "::error::server/Cargo.toml says $CARGO but the tag says $BASE"
            fail=1
          fi
          if [ "$WEB" != "$BASE" ]; then
            echo "::error::web/package.json says $WEB but the tag says $BASE"
            fail=1
          fi
          if ! grep -q "^## ${BASE}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${BASE}' section; a release with no notes is not a release"
            fail=1
          fi
          exit "$fail"

  # A multi-arch image is what makes `docker run ghcr.io/...` a real
  # instruction rather than an aspiration. arm64 matters: the cheapest hosts
  # people will actually deploy this on are ARM.
  image:
    needs: release-gate
    # Final releases only. A pre-release never moves :latest, and building an
    # arm64 image under emulation is the slowest job in this pipeline, spent on
    # a tag whose purpose is to find out whether the release works.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web bundle digest
        id: bundle
        run: |
          # Built inside the image too, but the digest has to be stamped in,
          # and it must be computed the same way everywhere or /version
          # reports something that matches nothing.
          cd web && npm ci --silent && npm run build >/dev/null
          cd dist && echo "sha256=$(find . -type f -print0 | sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A tag containing a hyphen is a pre-release by semver (v0.2.0-rc.1),
      # and `latest` must not follow one — anybody running
      # `docker run ghcr.io/.../runa` would silently get a release candidate.
      - name: Decide image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/$OWNER/runa:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*) echo "pre-release: not moving :latest" ;;
            *)   TAGS="$TAGS,ghcr.io/$OWNER/runa:latest" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNA_COMMIT=${{ github.sha }}
            RUNA_BUNDLE_SHA256=${{ steps.bundle.outputs.sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same installer the binary signing uses. This used to fetch
      # `releases/latest/download` with curl: whatever cosign was newest that
      # minute, with no checksum, on the one job holding a token that can push
      # the image.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Same keyless Sigstore signing as the binaries, so an image can be
          # verified without us distributing or protecting a key.
          cosign sign --yes \
            "ghcr.io/${{ steps.tags.outputs.owner }}/runa@${DIGEST}"

  build-release:
    needs: release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first target to fail cancels the rest, so one
      # problem masks every other one and each fix costs a full round trip.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # The line above installs the target into *stable*. rust-toolchain.toml
      # pins 1.98.0, and rustup honours that pin for every cargo invocation in
      # this directory — so the build ran on a toolchain that had no musl std
      # and failed with "can't find crate for `core`". This adds the target to
      # the pinned toolchain, which is the one that actually builds.
      # Same trap the fuzz job hit: the file quietly outranks the workflow.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle (reproducible)
        working-directory: web
        env:
          SOURCE_DATE_EPOCH: "0"
          TZ: UTC
          LC_ALL: C
        run: |
          npm ci
          npm run build

      - name: Bundle hash
        id: bundle
        working-directory: web/dist
        # `shasum` is present on both runner images; `sha256sum` and GNU
        # `sort -z` are not guaranteed on macOS. Same digest either way.
        run: echo "sha256=$(find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build server
        env:
          RUNA_COMMIT: ${{ github.sha }}
          RUNA_BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          SOURCE_DATE_EPOCH: "0"
        run: cargo build --release --locked --target ${{ matrix.target }} -p runa-server

      - name: Package
        shell: bash
        run: |
          dir=runa-${{ matrix.target }}
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/runa-server" "$dir/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/runa" "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign artifacts (keyless)
        shell: bash
        run: |
          for f in runa-*.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      # This step had never once run to completion: fail-fast cancelled the
      # job earlier every previous time, so its first real execution was on
      # v0.2.0-rc.2, where `-p` failed it — cargo-cyclonedx has no such flag,
      # and the workspace has a single member, so nothing needed selecting.
      # Both generators are pinned. release.yml fires only on a tag, so CI
      # cannot rehearse it; an unpinned tool that changes its CLI or its
      # output filename breaks the release at the moment a fix costs most.
      - name: SBOMs
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          # --target so the SBOM describes the dependency graph compiled into
          # the musl binary we ship, not the runner's host gnu graph — the two
          # differ wherever a dependency is cfg-gated.
          cargo cyclonedx --manifest-path server/Cargo.toml --format json \
            --target ${{ matrix.target }}
          # cargo-cyclonedx writes <crate>.cdx.json beside the manifest. The
          # upload glob is `runa-*-sbom.json` at the workspace root, which that
          # name matches in neither place nor form, so without this rename the
          # Rust SBOM is dropped and the job still goes green. Renaming here
          # (rather than widening the glob) keeps every release artifact flat
          # and consistently named, which is what `publish` globs in turn.
          mv server/runa-server.cdx.json runa-server-sbom.json
          cd web && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-file ../runa-web-sbom.json

      # The binaries were signed and the bills of materials describing them were
      # not, so an SBOM on the release page could be replaced with nothing to
      # show it. Same keyless signing, same certificate identity, verified the
      # same way (docs/SECURITY.md).
      - name: Sign SBOMs (keyless)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for f in runa-*-sbom.json; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runa-${{ matrix.target }}
          path: |
            runa-*.tar.gz
            runa-*.tar.gz.sha256
            runa-*.tar.gz.sig
            runa-*.tar.gz.pem
            runa-*-sbom.json
            runa-*-sbom.json.sig
            runa-*-sbom.json.pem

  publish:
    needs: [release-gate, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Release notes for this tag
        run: |
          set -euo pipefail
          BASE="${GITHUB_REF_NAME#v}"
          BASE="${BASE%%-*}"
          # Everything under this version's heading, up to the next one.
          awk -v want="## ${BASE}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > NOTES.md
          # release-gate already proved the section exists; this catches a
          # section that exists and is empty, which reads as an accident.
          test -s NOTES.md
          echo "--- notes ---"; cat NOTES.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist-files
      - name: Attach to tag release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: NOTES.md
          files: dist-files/*
