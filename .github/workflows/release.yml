name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A multi-arch image is what makes `docker run ghcr.io/...` a real
  # instruction rather than an aspiration. arm64 matters: the cheapest hosts
  # people will actually deploy this on are ARM.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web bundle digest
        id: bundle
        run: |
          # Built inside the image too, but the digest has to be stamped in,
          # and it must be computed the same way everywhere or /version
          # reports something that matches nothing.
          cd web && npm ci --silent && npm run build >/dev/null
          cd dist && echo "sha256=$(find . -type f -print0 | sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A tag containing a hyphen is a pre-release by semver (v0.2.0-rc.1),
      # and `latest` must not follow one — anybody running
      # `docker run ghcr.io/.../runa` would silently get a release candidate.
      - name: Decide image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/$OWNER/runa:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*) echo "pre-release: not moving :latest" ;;
            *)   TAGS="$TAGS,ghcr.io/$OWNER/runa:latest" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNA_COMMIT=${{ github.sha }}
            RUNA_BUNDLE_SHA256=${{ steps.bundle.outputs.sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Same keyless Sigstore signing as the binaries, so an image can be
          # verified without us distributing or protecting a key.
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
          cosign sign --yes \
            "ghcr.io/${{ steps.tags.outputs.owner }}/runa@${DIGEST}"

  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first target to fail cancels the rest, so one
      # problem masks every other one and each fix costs a full round trip.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The line above installs the target into *stable*. rust-toolchain.toml
      # pins 1.98.0, and rustup honours that pin for every cargo invocation in
      # this directory — so the build ran on a toolchain that had no musl std
      # and failed with "can't find crate for `core`". This adds the target to
      # the pinned toolchain, which is the one that actually builds.
      # Same trap the fuzz job hit: the file quietly outranks the workflow.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle (reproducible)
        working-directory: web
        env:
          SOURCE_DATE_EPOCH: "0"
          TZ: UTC
          LC_ALL: C
        run: |
          npm ci
          npm run build

      - name: Bundle hash
        id: bundle
        working-directory: web/dist
        # `shasum` is present on both runner images; `sha256sum` and GNU
        # `sort -z` are not guaranteed on macOS. Same digest either way.
        run: echo "sha256=$(find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build server
        env:
          RUNA_COMMIT: ${{ github.sha }}
          RUNA_BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          SOURCE_DATE_EPOCH: "0"
        run: cargo build --release --locked --target ${{ matrix.target }} -p runa-server

      - name: Package
        shell: bash
        run: |
          dir=runa-${{ matrix.target }}
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/runa-server" "$dir/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/runa" "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts (keyless)
        shell: bash
        run: |
          for f in runa-*.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      # This step had never once run to completion: fail-fast cancelled the
      # job earlier every previous time, so its first real execution was on
      # v0.2.0-rc.2, where `-p` failed it — cargo-cyclonedx has no such flag,
      # and the workspace has a single member, so nothing needed selecting.
      # Both generators are pinned. release.yml fires only on a tag, so CI
      # cannot rehearse it; an unpinned tool that changes its CLI or its
      # output filename breaks the release at the moment a fix costs most.
      - name: SBOMs
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          # --target so the SBOM describes the dependency graph compiled into
          # the musl binary we ship, not the runner's host gnu graph — the two
          # differ wherever a dependency is cfg-gated.
          cargo cyclonedx --manifest-path server/Cargo.toml --format json \
            --target ${{ matrix.target }}
          # cargo-cyclonedx writes <crate>.cdx.json beside the manifest. The
          # upload glob is `runa-*-sbom.json` at the workspace root, which that
          # name matches in neither place nor form, so without this rename the
          # Rust SBOM is dropped and the job still goes green. Renaming here
          # (rather than widening the glob) keeps every release artifact flat
          # and consistently named, which is what `publish` globs in turn.
          mv server/runa-server.cdx.json runa-server-sbom.json
          cd web && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-file ../runa-web-sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: runa-${{ matrix.target }}
          path: |
            runa-*.tar.gz
            runa-*.tar.gz.sha256
            runa-*.tar.gz.sig
            runa-*.tar.gz.pem
            runa-*-sbom.json

  publish:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-files
      - name: Attach to tag release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-files/*
