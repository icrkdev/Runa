name: ci

# What runs when. Minutes are billed on a private repository, so each job runs
# only where its result can still change something:
#   pull request   everything except fuzzing
#   push to main   the quick checks; the full suite already passed on the pull
#                  request that produced the commit
#   schedule       supply-chain advisories and fuzzing, which find new things
#                  without any new commit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # every Monday at 04:00 UTC

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request makes the run already in progress worthless, so
# stop paying for it. Runs on main and on the schedule are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check || true
      - name: Clippy
        run: cargo clippy -p runa-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p runa-server --locked
      - name: Banned patterns in server source (no disk, no plaintext logging)
        run: |
          ! grep -riE "sqlite|rusqlite|File::create|fs::write|OpenOptions" server/src
          ! grep -rE "println!|dbg!" server/src
      - name: Server-authored frames are never enveloped, and limits are bounded
        run: cargo test -p runa-server --locked --test hardening

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc -b
      - name: Lint
        working-directory: web
        run: npx eslint src --ext .ts,.tsx
      - name: Tests
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        run: npm run build
      # `npm audit` exits non-zero for BOTH a real finding and a registry
      # error, and the previous `--omit=dev ... || npm audit ...` fallback
      # conflated the two: when the registry returned 503 the fallback ran a
      # *different* audit with dev dependencies included and failed the build
      # on the vitest/vite/esbuild chain, while production had zero findings.
      # A transient outage silently rewrote the policy, at random, on main.
      #
      # So: parse the JSON, which distinguishes an outage (an `error` key) from
      # a result (a `metadata` key), and retry only the outage.
      #
      # Production findings fail the build. Dev findings are reported loudly
      # but do not block: the build tooling does shape the deployed artifact,
      # so they must be visible before anything reaches the box — but clearing
      # them currently needs a breaking vitest major, and a gate nobody can
      # pass is a gate that gets bypassed.
      - name: npm audit (production high+ fails the build)
        working-directory: web
        run: |
          set -uo pipefail
          prod=""
          for attempt in 1 2 3 4 5; do
            out=$(npm audit --omit=dev --json 2>/dev/null || true)
            if printf '%s' "$out" | jq -e 'has("metadata")' >/dev/null 2>&1; then
              prod="$out"
              break
            fi
            echo "attempt $attempt: registry did not return a result, retrying"
            sleep 15
          done
          if [ -z "$prod" ]; then
            echo "::error::npm registry unreachable after 5 attempts; the audit did not run"
            exit 1
          fi
          high=$(printf '%s' "$prod" | jq -r '.metadata.vulnerabilities.high // 0')
          crit=$(printf '%s' "$prod" | jq -r '.metadata.vulnerabilities.critical // 0')
          echo "production dependencies: $crit critical, $high high"

          dev=$(npm audit --json 2>/dev/null || true)
          if printf '%s' "$dev" | jq -e 'has("metadata")' >/dev/null 2>&1; then
            printf '%s' "$dev" | jq -r '
              .metadata.vulnerabilities
              | "including dev dependencies: \(.critical) critical, \(.high) high, \(.moderate) moderate"'
            printf '%s' "$dev" | jq -r '
              .vulnerabilities | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | "::warning::dev dependency \(.key) is \(.value.severity)"'
          else
            echo "::warning::dev-inclusive audit did not return a result; production result above still stands"
          fi

          if [ "$crit" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "::error::production dependencies have $crit critical and $high high advisories"
            exit 1
          fi
      - name: Third-party origin check on shipped HTML
        working-directory: web
        run: node scripts/check-origins.mjs

  # Three engines, not one. Chromium-only CI agreed with itself for months
  # while Safari and Firefox users were reporting layout and sync faults that
  # nothing here could see. The engines also disagree about things the tests
  # depend on — see severNetwork() in e2e-browser.mjs for the one that had a
  # disconnect test quietly not disconnecting anything.
  browser-e2e:
    # Pull requests only: the most expensive job, three times over.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every engine reports. A WebKit failure that hides whether Firefox
      # passed costs another full round trip to find out.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Install ${{ matrix.browser }}
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build web bundle
        working-directory: web
        run: npm run build
      - name: Build server
        run: cargo build --release -p runa-server
      - name: Two-peer browser E2E under enforced CSP
        working-directory: web
        env:
          RUNA_E2E_BROWSER: ${{ matrix.browser }}
        run: |
          ../target/release/runa-server &
          sleep 1
          node scripts/e2e-smoke.mjs
          node scripts/e2e-browser.mjs

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: runa:ci
          build-args: |
            RUNA_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: It must actually start, serve, and stay up
        run: |
          # These are the EXACT flags scripts/deploy-docker.sh uses. Testing a
          # looser configuration would prove nothing about the one we ship:
          # --read-only and --cap-drop=ALL are each capable of stopping the
          # container from starting at all.
          docker run -d --name runa-ci \
            -p 127.0.0.1:3000:3000 \
            --memory=256m --memory-swap=256m \
            --pids-limit=256 \
            --ulimit memlock=-1:-1 \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -e RUNA_BIND=0.0.0.0:3000 \
            -e RUNA_TRUSTED_PROXY=1 \
            runa:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/version || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "no response from /version"; docker logs runa-ci; exit 1; }
          # The SPA shell must be real, not the empty-string fallback that a
          # mis-pointed RUNA_DIST produces.
          curl -sf http://127.0.0.1:3000/ | grep -q '<div id="root">' \
            || { echo "index.html not served from the image"; docker logs runa-ci; exit 1; }
          curl -s http://127.0.0.1:3000/version | grep -q '${{ github.sha }}' \
            || { echo "RUNA_COMMIT build-arg did not reach the binary"; exit 1; }
          uid=$(docker inspect -f '{{.Config.User}}' runa-ci)
          [ "$uid" = "nonroot:nonroot" ] || { echo "image runs as $uid, expected nonroot"; exit 1; }
          # Still up after the checks — catches a container that starts, serves
          # once, then dies (read-only filesystem hitting a late write, say).
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' runa-ci)" = "true" ] \
            || { echo "container did not stay up"; docker logs runa-ci; exit 1; }
          # mlockall backs the "never swapped" claim in the threat model. It
          # fails silently without a memlock ulimit, so assert it succeeded
          # rather than trusting the flag is present.
          docker logs runa-ci 2>&1 | grep -q 'memory locked' \
            || { echo "mlockall did not take inside the container"; docker logs runa-ci; exit 1; }
          docker logs runa-ci | tail -5
          docker rm -f runa-ci

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny (bans database crates, licence check)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Three things this invocation has to get right, each hidden behind the
      # previous one:
      #   1. cargo-fuzz resolves targets at `<cwd>/fuzz/Cargo.toml`, so it runs
      #      from the crate root — not from server/fuzz, which made it look for
      #      server/fuzz/fuzz/Cargo.toml.
      #   2. The manifest needs `[package.metadata] cargo-fuzz = true`.
      #   3. `+nightly` is explicit because rust-toolchain.toml pins 1.98.0 at
      #      the repo root, and that pin overrides the nightly this job
      #      installs. cargo-fuzz needs -Z flags, so it fails without it.
      # Seeds first. fuzz/corpus is gitignored, so every scheduled run starts
      # empty — and create_body has to get an input past
      # serde_json::from_slice::<CreateRoomBody> before it reaches anything
      # worth testing. Random bytes will not build a nested object with the
      # right field names, so without these it would spend the whole budget
      # failing to parse.
      - name: Seed the corpora
        working-directory: server
        run: |
          for t in $(ls fuzz/seeds); do
            mkdir -p "fuzz/corpus/$t"
            cp fuzz/seeds/"$t"/* "fuzz/corpus/$t/" 2>/dev/null || true
          done
      # Time is weighted towards the two targets that can lose something.
      # frame_header parses a fixed 32-byte header with every offset bounds
      # checked, and room_name is a charset test; both are covered by unit
      # tests asserting the same properties, and neither has ever had anything
      # to find. log_compaction drives the only path that discards data, and
      # create_body guards the parameters the metadata endpoint has to be able
      # to answer for without disclosing that a room exists.
      - name: Run fuzz targets
        working-directory: server
        run: |
          cargo +nightly fuzz run frame_header    -- -max_total_time=300
          cargo +nightly fuzz run room_name       -- -max_total_time=300
          cargo +nightly fuzz run log_compaction  -- -max_total_time=900
          cargo +nightly fuzz run create_body     -- -max_total_time=900
