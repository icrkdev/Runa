version: 2
updates:
  # Workflow actions are pinned to full commit SHAs with the release tag in a
  # trailing comment; Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # cosign-installer v4 installs cosign 3, which publishes one bundle per
      # artifact in place of the .sig and .pem files docs/SECURITY.md verifies.
      # That move is made by hand, with the docs, not by a weekly bump.
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
